# /etc/systemd/system/bootwatchd.service.d/production.conf: the droplet. cloudflared (the
# Cloudflare Tunnel) is the only way in, so bootwatchd listens on loopback in plain HTTP and
# takes each client's address from CF-Connecting-IP.
[Service]
ExecStart=
ExecStart=/usr/local/bin/bootwatchd -listen 127.0.0.1:8470 -cloudflare
